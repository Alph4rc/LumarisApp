name: ios_club_app
description: "西建大iOS Club出品软件，包括教务系统数据查询，电费饭卡校车和社团内数据显示等内容"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.19+1

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  url_launcher: ^6.3.2
  android_intent_plus: ^6.0.0
  package_info_plus: ^9.0.0
  home_widget: ^0.8.1
  path_provider: ^2.1.5
  open_file: ^3.5.10
  html: ^0.15.6
  flutter_staggered_grid_view: ^0.7.0
  dio: ^5.9.0
  timezone: ^0.10.1
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  numberpicker: ^2.1.2
  fl_chart: ^1.1.1
  archive: ^4.0.7
  android_alarm_manager_plus: ^5.0.0
  msix: ^3.16.12
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  get: ^4.7.3
  display_mode: ^0.0.2
  encrypt: ^5.0.3
  macos_ui: ^2.2.2
  file_picker: ^10.3.7
  flutter_markdown: ^0.7.7+1
  logger: ^2.5.0
  reorderable_grid_view: ^2.2.8
  mpflutter_core: ^2.7.5
  mpflutter_build_tools: ^2.7.5
  mpflutter_wechat_api: ^2.2.3
  mpflutter_wechat_mapview: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.6.1
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  leak_tracker: ^11.0.1
  leak_tracker_flutter_testing: ^3.0.10

dependency_overrides:
  web: ^1.1.0
  window_manager: ^0.3.7

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon.ico
    - assets/icon.webp
    - assets/iOS_Club_Logo.webp
    - assets/女生.webp
    - assets/男生.webp
    - assets/iconfont/iconfont.json
    - assets/iconfont/iconfont.ttf
    - .env
    - LICENSE

  fonts:
    - family: IconFont
      fonts:
        - asset: assets/iconfont/iconfont.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/mac_icon.png"
  image_path: "assets/icon.png"  # 提供 1024x1024 原始图标
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  android: true
  ios: true
  color_dark: "#121212"
  image_dark: assets/icon.png
  web: true

msix_config:
  display_name: iOS Club App
  msix_version: 1.1.19.0
  logo_path: .\windows\runner\resources\app_icon.ico
  publisher_display_name: LuckyFish
  identity_name: LuckyFish.iOSClubApp
  timestamp_url: http://timestamp.digicert.com  # 或尝试其他服务器
  publisher: CN=7B495662-F6FD-47E2-B578-E845127E5AE3
  capabilities: "runFullTrust"